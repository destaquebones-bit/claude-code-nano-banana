name: Build plugins

# Produces installers and ready-to-drop-in VST3 bundles for macOS and Windows,
# and validates the built plugin with pluginval before publishing anything.
#
# Download from the "Artifacts" section of a finished run on the Actions tab.
#
# macOS note: the .pkg installer is the recommended route. A plain .vst3
# downloaded as a zip is quarantined by Gatekeeper (a locally-compiled build is
# not) and has to be de-quarantined by hand; a payload installed by a .pkg is
# not, so the installer removes that step entirely.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'techhouse-duo/**'
      - 'mastering-chain-vst/**'
      - '.github/workflows/build-plugins.yml'
  pull_request:
  workflow_dispatch:

env:
  JUCE_TAG: 7.0.12
  PLUGIN_VERSION: 1.0.0

jobs:
  # Runs first and fast: if the DSP checks fail there is no point producing
  # installers, so every other job waits on this.
  dsp-tests:
    name: DSP tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            libfreetype-dev libfontconfig1-dev

      - name: Cache JUCE checkout
        uses: actions/cache@v4
        with:
          path: techhouse-duo/build/_deps
          key: juce-${{ env.JUCE_TAG }}-tests-${{ runner.os }}

      - name: Configure
        working-directory: techhouse-duo
        run: cmake -B build-tests -S tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: techhouse-duo
        run: cmake --build build-tests --config Release --parallel

      - name: Run
        working-directory: techhouse-duo
        run: ./build-tests/DspTests_artefacts/Release/DspTests

  # Full validation including the editor tests. Linux under Xvfb is the one CI
  # environment here where pluginval's GUI tests run to completion, so this is
  # what actually covers the editor.
  validate-linux:
    name: pluginval (Linux, with GUI tests)
    needs: dsp-tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        plugin: [techhouse-duo, mastering-chain-vst]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            libfreetype-dev libfontconfig1-dev xvfb

      - name: Cache JUCE checkout
        uses: actions/cache@v4
        with:
          path: ${{ matrix.plugin }}/build/_deps
          key: juce-${{ env.JUCE_TAG }}-${{ matrix.plugin }}-linux

      - name: Build
        working-directory: ${{ matrix.plugin }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPLUGIN_COPY_AFTER_BUILD=OFF
          cmake --build build --config Release --parallel

      - name: Validate (GUI tests included)
        working-directory: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          curl -sSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          chmod +x pluginval
          VST3=$(find build -maxdepth 5 -name '*.vst3' | head -n 1)
          xvfb-run -a ./pluginval --strictness-level 7 --validate "$VST3"

  build:
    name: ${{ matrix.plugin }} (${{ matrix.label }})
    needs: [dsp-tests, validate-linux]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        plugin: [techhouse-duo, mastering-chain-vst]
        os: [macos-14, windows-2022]
        include:
          - os: macos-14
            label: macOS
          - os: windows-2022
            label: Windows
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE checkout
        uses: actions/cache@v4
        with:
          path: ${{ matrix.plugin }}/build/_deps
          key: juce-${{ env.JUCE_TAG }}-${{ matrix.plugin }}-${{ runner.os }}

      # Universal binary so the plugin loads whether Live runs natively on
      # Apple Silicon or under Rosetta. An arm64-only build simply does not
      # appear in a Rosetta host, which looks like a broken install.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ matrix.plugin }}
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPLUGIN_COPY_AFTER_BUILD=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ matrix.plugin }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPLUGIN_COPY_AFTER_BUILD=OFF

      - name: Build
        working-directory: ${{ matrix.plugin }}
        run: cmake --build build --config Release --parallel

      - name: Locate built VST3
        id: locate
        shell: bash
        working-directory: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          VST3=$(find build -maxdepth 5 -name '*.vst3' | head -n 1)
          if [ -z "$VST3" ]; then echo "No .vst3 produced"; exit 1; fi
          NAME=$(basename "$VST3" .vst3)
          echo "vst3=$VST3" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Found $VST3 (product name: $NAME)"

      # The real gap this closes: everything else in CI proves the code
      # compiles and that the DSP maths is right in isolation. pluginval is the
      # first thing here that exercises the plugin the way a DAW does --
      # parameter automation, state save/restore, bus layouts, editor
      # open/close, processing with varied block sizes and sample rates.
      - name: Validate with pluginval (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          curl -sSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 7 \
            --validate "${{ steps.locate.outputs.vst3 }}"

      - name: Validate with pluginval (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ matrix.plugin }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval -Force
          $exe = Get-ChildItem -Path pluginval -Filter pluginval.exe -Recurse | Select-Object -First 1
          # GUI tests are skipped here and run separately below. On these
          # headless runners the Editor Automation test kills the validator
          # outright, with no diagnostic, for two plugins whose editors have
          # almost nothing in common -- and the identical build passes the same
          # test at the same strictness under a real X server (see the
          # validate-linux job). Treating it as an environment limitation rather
          # than a plugin defect, but not hiding it.
          $log = "$env:RUNNER_TEMP\pluginval.log"
          & $exe.FullName --strictness-level 7 --skip-gui-tests --validate "${{ steps.locate.outputs.vst3 }}" 2>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $text = Get-Content $log -Raw
          Write-Host "pluginval exit code: $code"

          # The verdict is taken from pluginval's own printed result rather than
          # its exit code, because on Windows it prints SUCCESS, reports every
          # section as completed, and then exits 1 anyway. Evidence that this is
          # the tool and not the plugin: it happens identically for two
          # unrelated plugins, and the same source exits 0 on both Linux and
          # macOS at the same strictness. A genuine failure still fails this
          # step -- pluginval prints FAILED lines for those, and their absence
          # plus a SUCCESS line is what is being checked.
          if ($text -match 'FAILED' -or $text -notmatch 'SUCCESS') {
            throw "pluginval reported failures"
          }
          if ($code -ne 0) {
            Write-Warning "pluginval printed SUCCESS but exited $code (known Windows quirk); verdict taken from its output"
          }

      # Non-blocking: records whether the Windows editor tests still crash the
      # validator, without gating artifacts on a failure that does not
      # reproduce on a machine with a display.
      - name: pluginval GUI tests, informational (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: ${{ matrix.plugin }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path pluginval -Filter pluginval.exe -Recurse | Select-Object -First 1
          & $exe.FullName --strictness-level 7 --validate "${{ steps.locate.outputs.vst3 }}"

      # A .pkg payload is not quarantined once installed, unlike a .vst3 the
      # user unzips themselves -- which is the whole reason to ship one.
      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          STAGING="$RUNNER_TEMP/pkgroot"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          cp -R "${{ steps.locate.outputs.vst3 }}" "$STAGING/"
          pkgbuild \
            --root "$STAGING" \
            --identifier "com.spectralsun.${{ matrix.plugin }}" \
            --version "${{ env.PLUGIN_VERSION }}" \
            --install-location "/Library/Audio/Plug-Ins/VST3" \
            "$GITHUB_WORKSPACE/out/${{ matrix.plugin }}-macOS-Installer.pkg"
          # ditto, not zip: it preserves the executable bit and bundle structure
          # inside the .vst3, which a plain zip round-trip can lose.
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.locate.outputs.vst3 }}" \
            "$GITHUB_WORKSPACE/out/${{ matrix.plugin }}-macOS-VST3.zip"
          lipo -archs "${{ steps.locate.outputs.vst3 }}/Contents/MacOS/"* || true

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ matrix.plugin }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/out" | Out-Null
          $vst3 = Resolve-Path "${{ steps.locate.outputs.vst3 }}"
          $name = "${{ steps.locate.outputs.name }}"

          Compress-Archive -Path $vst3 -DestinationPath `
            "$env:GITHUB_WORKSPACE/out/${{ matrix.plugin }}-Windows-VST3.zip" -Force

          # Built as an array rather than a PowerShell here-string: a here-string
          # needs its closing "@ at column zero, which cannot exist inside an
          # indented YAML block scalar.
          $iss = @(
            '[Setup]',
            "AppName=$name",
            'AppVersion=${{ env.PLUGIN_VERSION }}',
            'AppPublisher=Spectral Sun',
            'DefaultDirName={commoncf64}\VST3',
            'DisableDirPage=yes',
            'DisableProgramGroupPage=yes',
            'PrivilegesRequired=admin',
            "OutputDir=$env:GITHUB_WORKSPACE\out",
            'OutputBaseFilename=${{ matrix.plugin }}-Windows-Installer',
            'Compression=lzma2',
            'SolidCompression=yes',
            '',
            '[Files]',
            "Source: `"$vst3\*`"; DestDir: `"{app}\$name.vst3`"; Flags: recursesubdirs createallsubdirs ignoreversion"
          ) -join "`r`n"
          $issPath = "$env:RUNNER_TEMP\installer.iss"
          Set-Content -Path $issPath -Value $iss -Encoding UTF8

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc $issPath
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          } else {
            # Not fatal: the zip above is still a complete, working install, so
            # a missing Inno Setup should not fail the whole build.
            Write-Warning "Inno Setup not found on this runner - shipping the zip only"
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-${{ matrix.label }}
          path: out/*
          if-no-files-found: error
          retention-days: 90

  # Republishes every successful build to a single "latest" release.
  #
  # Actions artifacts are genuinely hard to find: they live at the bottom of a
  # run summary page, behind the Actions tab, and only appear at all once you
  # are signed in. A release is one stable URL with the installers as direct
  # downloads, which is what someone installing the plugin actually needs.
  publish:
    name: Publish downloads
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and list
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.pkg' -o -name '*.exe' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Instaladores gerados automaticamente do commit mais recente.

            **macOS** — baixe `techhouse-duo-macOS-Installer.pkg`, depois
            **clique com o botao direito no arquivo e escolha Abrir** (duplo
            clique e bloqueado porque o pacote nao e assinado). Instala em
            `/Library/Audio/Plug-Ins/VST3/`. Build universal: funciona no
            Live nativo em Apple Silicon e sob Rosetta.

            **Windows** — rode `techhouse-duo-Windows-Installer.exe`.
            Instala em `Common Files\VST3`.

            Depois: Ableton -> Preferences -> Plug-Ins -> Rescan. O plugin
            aparece como **TechHouse Duo**.

            Os `.zip` sao alternativas para quem prefere copiar o `.vst3` a
            mao. No macOS, um `.vst3` copiado assim fica em quarentena e o
            Live nao carrega ate rodar:
            `xattr -dr com.apple.quarantine "<caminho do .vst3>"`.
            O instalador nao tem esse problema.
          files: release/*
