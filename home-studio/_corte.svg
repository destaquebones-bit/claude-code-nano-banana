  <text class="s-dimt" x="621.6" y="578.0" text-anchor="middle" fill="var(--mute)">42,4</text>
  <line x1="627.0" y1="640.1" x2="707.2" y2="609.1" stroke="var(--flag)" stroke-width="1.1"/>
  <text class="s-dimt" x="712.2" y="613.1" text-anchor="start" fill="var(--flag)">face da frente</text>
  <text class="s-dimt" x="712.2" y="629.1" text-anchor="start" fill="var(--mute)">hipotenusa 60 cm</text>
  <text class="s-dimt" x="576.0" y="725.2" text-anchor="start">Duas ripas encostam nas paredes.</text>
  <text class="s-dimt" x="576.0" y="742.2" text-anchor="start">A terceira fica no v&#233;rtice do canto.</text>
  <rect x="810.0" y="600.0" width="129.0" height="221.9" fill="var(--surface)" stroke="var(--mute)" stroke-width="1"/>
  <rect x="810.0" y="600.0" width="16.0" height="221.9" fill="var(--wood)" stroke="var(--ink)" stroke-width="1.4"/>
  <rect x="923.0" y="600.0" width="16.0" height="221.9" fill="var(--wood)" stroke="var(--ink)" stroke-width="1.4"/>
  <rect x="826.0" y="613.3" width="97.0" height="14.0" fill="var(--wood)" stroke="var(--ink)" stroke-width="1.4"/>
