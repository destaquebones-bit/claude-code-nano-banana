<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 940">
  <text class="s-dimt" x="92.0" y="58.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.6">O TRI&#194;NGULO &#183; COMO CORTAR E COMO PARAFUSAR</text>
  <text class="s-dimt" x="92.0" y="78.0" text-anchor="start">Tri&#226;ngulo ret&#226;ngulo is&#243;sceles: catetos 42,4 cm, hipotenusa 60 cm. Nenhum transferidor entra nessa obra.</text>
  <text class="s-dimt" x="92.0" y="140.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">1 &#183; O TRUQUE &#183; marque um QUADRADO e corte a diagonal</text>
