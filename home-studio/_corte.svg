  <line x1="132.0" y1="440.0" x2="132.0" y2="462.0" stroke="var(--mute)" stroke-width="1.2"/>
  <text class="s-dimt" x="144.0" y="432.0" text-anchor="start" fill="var(--mute)">90&#176;</text>
  <polyline points="348.0,462.0 348.0,460.9 348.1,459.8 348.2,458.7 348.3,457.6 348.5,456.5 348.7,455.4 348.9,454.3 349.2,453.2 349.5,452.1 349.8,451.1 350.2,450.0 350.6,449.0 351.0,448.0 351.5,447.0 352.0,446.0 352.6,445.0 353.1,444.0 353.7,443.1 354.4,442.2 355.0,441.3 355.7,440.4 356.4,439.6 357.2,438.8 358.0,438.0" fill="none" stroke="var(--flag)" stroke-width="1.3"/>
  <text class="s-dimt" x="336.7" y="447.2" text-anchor="middle" fill="var(--flag)">45&#176;</text>
