  <text class="s-dimt" x="246.0" y="166.0" text-anchor="middle" fill="var(--mute)">42,4 cm</text>
  <line x1="94.0" y1="190.0" x2="94.0" y2="462.0" stroke="var(--mute)" stroke-width="1"/>
  <line x1="89.0" y1="190.0" x2="99.0" y2="190.0" stroke="var(--mute)" stroke-width="1"/>
  <line x1="89.0" y1="462.0" x2="99.0" y2="462.0" stroke="var(--mute)" stroke-width="1"/>
  <text class="s-dimt" x="87.0" y="326.0" text-anchor="middle" fill="var(--mute)" transform="rotate(-90 87.0 326.0)">42,4 cm</text>
  <text class="s-dimt" x="251.4" y="331.4" text-anchor="start" fill="var(--flag)" transform="rotate(-45 251.4 331.4)">60 cm</text>
  <text class="s-dimt" x="92.0" y="506.0" text-anchor="start">Um quadrado de 42,4 &#215; 42,4 cortado na diagonal d&#225;</text>
  <text class="s-dimt" x="92.0" y="523.0" text-anchor="start">DOIS tri&#226;ngulos perfeitos, com os 45&#176; de gra&#231;a.</text>
  <text class="s-dimt" x="92.0" y="540.0" text-anchor="start"></text>
  <text class="s-dimt" x="92.0" y="557.0" text-anchor="start">Marque o quadrado com esquadro de pedreiro. Confira</text>
  <text class="s-dimt" x="92.0" y="574.0" text-anchor="start">medindo as duas diagonais: t&#234;m que dar igual.</text>
  <text class="s-dimt" x="92.0" y="591.0" text-anchor="start"></text>
  <text class="s-dimt" x="92.0" y="608.0" text-anchor="start">42,4 cm &#233; 42 cm e 4 mm. N&#227;o arredonde para 42 &#8212; o</text>
  <text class="s-dimt" x="92.0" y="625.0" text-anchor="start">erro se acumula e a hipotenusa n&#227;o fecha em 60.</text>
  <text class="s-dimt" x="560.0" y="140.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">2 &#183; 4 TRI&#194;NGULOS POR CHAPA</text>
  <rect x="560.0" y="180.0" width="310.0" height="155.0" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
  <polygon points="560.0,289.5 560.0,180.0 669.5,289.5" fill="var(--mdf-soft)" stroke="var(--flag)" stroke-width="1.6"/>
  <polygon points="669.5,180.0 779.1,180.0 779.1,289.5" fill="var(--mdf-soft)" stroke="var(--flag)" stroke-width="1.6"/>
  <text class="s-dimt" x="715.0" y="357.0" text-anchor="middle" fill="var(--mute)">chapa 1,20 &#215; 0,60</text>
  <line x1="560.0" y1="289.5" x2="870.0" y2="289.5" stroke="var(--mute)" stroke-width="1" stroke-dasharray="5 5"/>
  <text class="s-dimt" x="866.0" y="322.4" text-anchor="end" fill="var(--mute)">sobra 17 cm &#8212; gua&#231;os e cal&#231;os</text>
  <line x1="546.0" y1="180.0" x2="546.0" y2="289.5" stroke="var(--mute)" stroke-width="1"/>
  <line x1="541.0" y1="180.0" x2="551.0" y2="180.0" stroke="var(--mute)" stroke-width="1"/>
  <line x1="541.0" y1="289.5" x2="551.0" y2="289.5" stroke="var(--mute)" stroke-width="1"/>
  <text class="s-dimt" x="539.0" y="234.8" text-anchor="middle" fill="var(--mute)" transform="rotate(-90 539.0 234.8)">42,4</text>
  <text class="s-dimt" x="560.0" y="383.0" text-anchor="start">Tr&#234;s por chapa, alternando ponta para cima e para</text>
  <text class="s-dimt" x="560.0" y="400.0" text-anchor="start">baixo. O quarto sai da sobra da chapa seguinte.</text>
  <text class="s-dimt" x="560.0" y="417.0" text-anchor="start"></text>
  <text class="s-dimt" x="560.0" y="434.0" text-anchor="start">Voc&#234; precisa de 8 tri&#226;ngulos no total:</text>
  <text class="s-dimt" x="560.0" y="451.0" text-anchor="start">2 traps &#215; 2 m&#243;dulos &#215; 2 tampas.</text>
  <text class="s-dimt" x="560.0" y="556.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">3 &#183; O M&#211;DULO &#183; onde cada ripa fica</text>
