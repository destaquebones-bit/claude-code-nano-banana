  <text class="s-dimt" x="874.5" y="578.0" text-anchor="middle" fill="var(--mute)">60 cm</text>
  <line x1="796.0" y1="600.0" x2="796.0" y2="821.9" stroke="var(--mute)" stroke-width="1"/>
  <line x1="791.0" y1="600.0" x2="801.0" y2="600.0" stroke="var(--mute)" stroke-width="1"/>
  <line x1="791.0" y1="821.9" x2="801.0" y2="821.9" stroke="var(--mute)" stroke-width="1"/>
  <text class="s-dimt" x="789.0" y="710.9" text-anchor="middle" fill="var(--mute)" transform="rotate(-90 789.0 710.9)">1,20 m</text>
  <text class="s-dimt" x="810.0" y="847.9" text-anchor="start" fill="var(--mute)">FRENTE</text>
  <text class="s-dimt" x="810.0" y="869.9" text-anchor="start">As 3 travessas seguram o tecido</text>
  <text class="s-dimt" x="810.0" y="886.9" text-anchor="start">e travam o esquadro da face.</text>
  <text class="s-dimt" x="980.0" y="140.0" text-anchor="start" fill="var(--flag)" letter-spacing="1.5">4 &#183; COMO PARAFUSAR NA PONTA DA RIPA</text>
  <line x1="980.0" y1="152.0" x2="1310.0" y2="152.0" stroke="var(--mute)" stroke-width="1"/>
  <rect x="990.0" y="182.0" width="190.0" height="16.0" fill="var(--mdf-soft)" stroke="var(--ink)" stroke-width="1.6"/>
  <rect x="1048.0" y="198.0" width="74.0" height="150.0" fill="var(--wood)" stroke="var(--ink)" stroke-width="1.6"/>
  <text class="s-dimt" x="1190.0" y="193.0" text-anchor="start" fill="var(--mute)">tri&#226;ngulo</text>
  <text class="s-dimt" x="1132.0" y="274.0" text-anchor="start" fill="var(--mute)">ripa em p&#233;</text>
  <line x1="1068.0" y1="176.0" x2="1068.0" y2="198.0" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="1068.0" y1="198.0" x2="1068.0" y2="250.0" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="3 3"/>
  <polygon points="1061.0,182.0 1075.0,182.0 1071.0,189.0 1065.0,189.0" fill="var(--flag)" stroke="var(--flag)" stroke-width="1"/>
  <line x1="1102.0" y1="176.0" x2="1102.0" y2="198.0" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="1102.0" y1="198.0" x2="1102.0" y2="250.0" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="3 3"/>
  <polygon points="1095.0,182.0 1109.0,182.0 1105.0,189.0 1099.0,189.0" fill="var(--flag)" stroke="var(--flag)" stroke-width="1"/>
  <text class="s-dimt" x="1195.0" y="220.0" text-anchor="start" fill="var(--flag)">furo-guia 2,5 mm</text>
  <text class="s-dimt" x="1195.0" y="236.0" text-anchor="start" fill="var(--mute)">na ponta da ripa</text>
  <text class="s-dimt" x="1195.0" y="174.0" text-anchor="start" fill="var(--flag)">escareado &#8212; cabe&#231;a afundada</text>
  <text class="s-dimt" x="980.0" y="368.0" text-anchor="start">Sempre DOIS parafusos por encontro. Um s&#243; deixa a</text>
  <text class="s-dimt" x="980.0" y="385.0" text-anchor="start">ripa girar e o esquadro se perde.</text>
  <text class="s-dimt" x="980.0" y="402.0" text-anchor="start"></text>
  <text class="s-dimt" x="980.0" y="419.0" text-anchor="start">Fura antes, sempre. Ripa de 2,5 cm racha na ponta se</text>
  <text class="s-dimt" x="980.0" y="436.0" text-anchor="start">voc&#234; enfiar parafuso seco.</text>
  <text class="s-dimt" x="980.0" y="453.0" text-anchor="start"></text>
  <text class="s-dimt" x="980.0" y="470.0" text-anchor="start">Broca 2,5 mm na ripa (furo-guia) e 3,7 mm na chapa</text>
  <text class="s-dimt" x="980.0" y="487.0" text-anchor="start">(furo passante) &#8212; assim o parafuso PUXA as duas.</text>
  <text class="s-dimt" x="980.0" y="504.0" text-anchor="start"></text>
  <text class="s-dimt" x="980.0" y="521.0" text-anchor="start">Escareie a chapa. A cabe&#231;a tem que afundar: o tecido</text>
  <text class="s-dimt" x="980.0" y="538.0" text-anchor="start">passa por cima e cabe&#231;a saliente marca e rasga.</text>
  <text class="s-dimt" x="980.0" y="555.0" text-anchor="start"></text>
  <text class="s-dimt" x="980.0" y="572.0" text-anchor="start">Parafuso 3,5 &#215; 40 mm. Menor que isso n&#227;o pega ponta.</text>
  <text class="s-leg" x="980.0" y="603.0" text-anchor="start" fill="var(--flag)">COLA &#201; QUEM SEGURA</text>
  <text class="s-dimt" x="980.0" y="623.0" text-anchor="start">Ponta de ripa &#233; fibra cortada: parafuso ali agarra</text>
  <text class="s-dimt" x="980.0" y="640.0" text-anchor="start">pouco. Passe cola branca de madeira em toda junta.</text>
  <text class="s-dimt" x="980.0" y="657.0" text-anchor="start"></text>
  <text class="s-dimt" x="980.0" y="674.0" text-anchor="start">O parafuso &#233; o grampo que segura enquanto a cola</text>
  <text class="s-dimt" x="980.0" y="691.0" text-anchor="start">cura. Depois de seca, ela &#233; que faz a for&#231;a.</text>
  <text class="s-dimt" x="1370.0" y="140.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">LISTA POR M&#211;DULO</text>
  <line x1="1370.0" y1="152.0" x2="1620.0" y2="152.0" stroke="var(--mute)" stroke-width="1"/>
  <circle cx="1382.0" cy="174.0" r="11.0" fill="var(--ink)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="1382.0" y="178.0" text-anchor="middle" fill="var(--paper)">1</text>
  <text class="s-leg" x="1404.0" y="171.0" text-anchor="start" fill="var(--ink)">Tri&#226;ngulo de chapa</text>
  <text class="s-dimt" x="1404.0" y="186.0" text-anchor="start">2 pe&#231;as &#183; 42,4/42,4/60</text>
  <circle cx="1382.0" cy="214.0" r="11.0" fill="var(--wood)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="1382.0" y="218.0" text-anchor="middle" fill="var(--paper)">2</text>
  <text class="s-leg" x="1404.0" y="211.0" text-anchor="start" fill="var(--ink)">Longarina do v&#233;rtice</text>
  <text class="s-dimt" x="1404.0" y="226.0" text-anchor="start">1 &#183; ripa de 1,20 m</text>
  <circle cx="1382.0" cy="254.0" r="11.0" fill="var(--wood)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="1382.0" y="258.0" text-anchor="middle" fill="var(--paper)">3</text>
  <text class="s-leg" x="1404.0" y="251.0" text-anchor="start" fill="var(--ink)">Longarinas da frente</text>
  <text class="s-dimt" x="1404.0" y="266.0" text-anchor="start">2 &#183; ripa de 1,20 m</text>
  <circle cx="1382.0" cy="294.0" r="11.0" fill="var(--flag)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="1382.0" y="298.0" text-anchor="middle" fill="var(--paper)">4</text>
  <text class="s-leg" x="1404.0" y="291.0" text-anchor="start" fill="var(--ink)">Travessas da frente</text>
  <text class="s-dimt" x="1404.0" y="306.0" text-anchor="start">3 &#183; ripa de 0,60 m</text>
  <line x1="1370.0" y1="346.0" x2="1620.0" y2="346.0" stroke="var(--mute)" stroke-width="1"/>
  <text class="s-dimt" x="1370.0" y="372.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">TOTAL DA OBRA</text>
  <text class="s-dimt" x="1370.0" y="396.0" text-anchor="start">Tri&#226;ngulos de chapa</text>
  <text class="s-dimt" x="1620.0" y="396.0" text-anchor="end">8</text>
  <text class="s-dimt" x="1370.0" y="415.0" text-anchor="start">Ripa (longarinas)</text>
  <text class="s-dimt" x="1620.0" y="415.0" text-anchor="end">14,4 m</text>
  <text class="s-dimt" x="1370.0" y="434.0" text-anchor="start">Ripa (travessas)</text>
  <text class="s-dimt" x="1620.0" y="434.0" text-anchor="end">7,2 m</text>
  <text class="s-dimt" x="1370.0" y="453.0" text-anchor="start">Ripa total</text>
  <text class="s-dimt" x="1620.0" y="453.0" text-anchor="end">21,6 m</text>
  <text class="s-dimt" x="1370.0" y="472.0" text-anchor="start">Parafuso 3,5 &#215; 40</text>
  <text class="s-dimt" x="1620.0" y="472.0" text-anchor="end">~120</text>
  <text class="s-dimt" x="1370.0" y="491.0" text-anchor="start">Cola branca</text>
  <text class="s-dimt" x="1620.0" y="491.0" text-anchor="end">1 frasco</text>
  <line x1="1370.0" y1="530.0" x2="1620.0" y2="530.0" stroke="var(--mute)" stroke-width="1"/>
  <text class="s-dimt" x="1370.0" y="556.0" text-anchor="start" fill="var(--flag)" letter-spacing="1.5">ORDEM DE MONTAGEM</text>
  <text class="s-dimt" x="1370.0" y="580.0" text-anchor="start">Corte os 8 tri&#226;ngulos.</text>
  <text class="s-dimt" x="1370.0" y="597.0" text-anchor="start">Corte as ripas no esquadro (90&#176;).</text>
  <text class="s-dimt" x="1370.0" y="614.0" text-anchor="start">Deite UM tri&#226;ngulo no ch&#227;o plano.</text>
  <text class="s-dimt" x="1370.0" y="631.0" text-anchor="start">Fure, cole e parafuse as 3 longarinas</text>
  <text class="s-dimt" x="1370.0" y="648.0" text-anchor="start">em p&#233; sobre ele.</text>
  <text class="s-dimt" x="1370.0" y="665.0" text-anchor="start">Ponha o segundo tri&#226;ngulo em cima e</text>
  <text class="s-dimt" x="1370.0" y="682.0" text-anchor="start">repita. O esquadro sai sozinho.</text>
  <text class="s-dimt" x="1370.0" y="699.0" text-anchor="start">Por &#250;ltimo as 3 travessas da frente.</text>
  <text class="s-dimt" x="1370.0" y="730.0" text-anchor="start" fill="var(--flag)">Nenhuma ripa leva corte em 45&#176;. Todas as pontas</text>
  <text class="s-dimt" x="1370.0" y="747.0" text-anchor="start" fill="var(--flag)">s&#227;o cortadas em 90&#176;. Quem faz o &#226;ngulo &#233; a chapa.</text>
</svg>