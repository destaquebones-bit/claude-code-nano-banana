  <text class="s-dimt" x="1220.0" y="411.0" text-anchor="start">3 tri&#226;ngulos 0,42 / 0,42 / 0,60</text>
  <text class="s-dimt" x="1540.0" y="411.0" text-anchor="end">8,7 m</text>
  <text class="s-dimt" x="1220.0" y="430.0" text-anchor="start">Sarrafo 2,5 &#215; 5 cm d&#225; e sobra</text>
  <text class="s-dimt" x="1540.0" y="430.0" text-anchor="end">&#8776;19 m</text>
  <text class="s-dimt" x="1220.0" y="449.0" text-anchor="start">Comprar</text>
  <text class="s-dimt" x="1540.0" y="449.0" text-anchor="end">7 barras de 3 m</text>
  <text class="s-dimt" x="1220.0" y="474.0" text-anchor="start">O recheio pesa 2,5 kg. O quadro vai pesar</text>
  <text class="s-dimt" x="1220.0" y="489.0" text-anchor="start">mais que a l&#227; &#8212; n&#227;o precisa de madeira grossa.</text>
