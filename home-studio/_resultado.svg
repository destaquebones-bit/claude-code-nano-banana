  <text class="s-leg" x="1517.1" y="390.9" text-anchor="start" fill="#1670b0">L</text>
  <text class="s-leg" x="1517.1" y="409.1" text-anchor="start" fill="#c2703a">R</text>
  <text class="s-dimt" x="1540.0" y="286.0" text-anchor="end" fill="#8a8579">normalizado pela m&#233;dia de 400 a 4000 Hz de cada curva</text>
  <text class="s-dimt" x="70.0" y="676.0" text-anchor="start" fill="#c2703a" letter-spacing="1.5">O QUE MUDA NO PROJETO</text>
  <circle cx="79" cy="696" r="9" fill="#c2703a"/>
  <text class="s-tag" x="79" y="700" text-anchor="middle" fill="#faf9f5">1</text>
  <text class="s-leg" x="96.0" y="700.0" text-anchor="start" fill="#1a1a18">N&#195;O existe assimetria entre os monitores.</text>
  <text class="s-dimt" x="96.0" y="720.0" text-anchor="start">L e R andam juntos: desvio m&#233;dio de 2,8 dB</text>
  <text class="s-dimt" x="96.0" y="736.0" text-anchor="start">entre 30 e 400 Hz, e n&#237;vel de banda</text>
  <text class="s-dimt" x="96.0" y="752.0" text-anchor="start">m&#233;dia a 0,4 dB um do outro.</text>
  <circle cx="479" cy="696" r="9" fill="#c2703a"/>
  <text class="s-tag" x="479" y="700" text-anchor="middle" fill="#faf9f5">2</text>
  <text class="s-leg" x="496.0" y="700.0" text-anchor="start" fill="#1a1a18">O buraco de 15 dB era o microfone fora do lugar.</text>
  <text class="s-dimt" x="496.0" y="720.0" text-anchor="start">Some quando o mic vai para o ponto certo. A</text>
  <text class="s-dimt" x="496.0" y="736.0" text-anchor="start">porta e o monitor esquerdo est&#227;o</text>
  <text class="s-dimt" x="496.0" y="752.0" text-anchor="start">inocentes.</text>
  <circle cx="879" cy="696" r="9" fill="#c2703a"/>
  <text class="s-tag" x="879" y="700" text-anchor="middle" fill="#faf9f5">3</text>
  <text class="s-leg" x="896.0" y="700.0" text-anchor="start" fill="#1a1a18">Os traps de canto j&#225; fizeram o que podiam.</text>
  <text class="s-dimt" x="896.0" y="720.0" text-anchor="start">De 250 Hz para cima a sala est&#225; entre 0,24</text>
  <text class="s-dimt" x="896.0" y="736.0" text-anchor="start">e 0,47 s. N&#227;o precisa de mais nada nessa</text>
  <text class="s-dimt" x="896.0" y="752.0" text-anchor="start">faixa.</text>
  <circle cx="1279" cy="696" r="9" fill="#c2703a"/>
  <text class="s-tag" x="1279" y="700" text-anchor="middle" fill="#faf9f5">4</text>
  <text class="s-leg" x="1296.0" y="700.0" text-anchor="start" fill="#1a1a18">Falta atacar 63 Hz &#8212; e s&#243; isso.</text>
  <text class="s-dimt" x="1296.0" y="720.0" text-anchor="start">Largura 2,75 m d&#225; 62,4 Hz; altura 2,65 m</text>
  <text class="s-dimt" x="1296.0" y="736.0" text-anchor="start">d&#225; 64,7 Hz. Dois modos empilhados. &#201;</text>
  <text class="s-dimt" x="1296.0" y="752.0" text-anchor="start">a membrana.</text>
</svg>