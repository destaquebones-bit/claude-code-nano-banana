  <text class="s-leg" x="985.8" y="180.0" text-anchor="start" fill="var(--ink)">Bass trap &#183; CONSTRUIR AGORA</text>
  <text class="s-dimt" x="985.8" y="195.0" text-anchor="start">frontal esquerdo &#183; 0,42 &#215; 0,42 &#215; 2,40</text>
  <circle cx="964.8" cy="224.0" r="11.5" fill="var(--ray)"/>
  <text class="s-tag" x="964.8" y="228.0" text-anchor="middle" fill="var(--paper)">B</text>
  <text class="s-leg" x="985.8" y="222.0" text-anchor="start" fill="var(--ink)">Bass trap &#183; CONSTRUIR AGORA</text>
  <text class="s-dimt" x="985.8" y="237.0" text-anchor="start">traseiro direito &#183; na diagonal do A</text>
