  <text class="s-dimt" x="56.0" y="44.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.6">PLANTA &#183; 2,75 &#215; 3,70 m &#183; P&#201;-DIREITO 2,65 &#183; GEOMETRIA FECHADA</text>
  <text class="s-dimt" x="56.0" y="64.0" text-anchor="start">Cotas em metros &#183; laranja = som direto e espelhos &#183; verde tracejado = caminho das reflex&#245;es precoces</text>
