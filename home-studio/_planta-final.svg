  <text class="s-tag" x="964.8" y="270.0" text-anchor="middle" fill="var(--paper)">2</text>
  <text class="s-leg" x="985.8" y="264.0" text-anchor="start" fill="var(--ink)">Canto frontal direito &#183; bloqueado</text>
  <text class="s-dimt" x="985.8" y="279.0" text-anchor="start">a porta &#183; s&#243; 0,42 &#215; 0,55 acima de 2,10</text>
  <circle cx="964.8" cy="308.0" r="11.5" fill="var(--flag)"/>
  <text class="s-tag" x="964.8" y="312.0" text-anchor="middle" fill="var(--paper)">3</text>
  <text class="s-leg" x="985.8" y="306.0" text-anchor="start" fill="var(--ink)">Canto traseiro esquerdo &#183; meio livre</text>
  <text class="s-dimt" x="985.8" y="321.0" text-anchor="start">o arm&#225;rio s&#243; vai at&#233; ~1,35 &#183; vaga do 3&#186; trap</text>
  <circle cx="964.8" cy="350.0" r="11.5" fill="var(--ray)"/>
  <text class="s-tag" x="964.8" y="354.0" text-anchor="middle" fill="var(--paper)">4</text>
  <text class="s-leg" x="985.8" y="348.0" text-anchor="start" fill="var(--ink)">Bloco da parede frontal</text>
  <text class="s-dimt" x="985.8" y="363.0" text-anchor="start">4 m&#243;dulos &#183; x 0,58 a 1,78 &#183; z 1,45 a 2,65</text>
  <circle cx="964.8" cy="392.0" r="11.5" fill="var(--felt)"/>
  <text class="s-tag" x="964.8" y="396.0" text-anchor="middle" fill="var(--paper)">5</text>
  <text class="s-leg" x="985.8" y="390.0" text-anchor="start" fill="var(--ink)">TV 48"</text>
  <text class="s-dimt" x="985.8" y="405.0" text-anchor="start">x 0,835 a 1,915 &#8212; centralizada, com 1,5 cm de folga</text>
  <circle cx="964.8" cy="434.0" r="11.5" fill="var(--ray)"/>
  <text class="s-tag" x="964.8" y="438.0" text-anchor="middle" fill="var(--paper)">6</text>
  <text class="s-leg" x="985.8" y="432.0" text-anchor="start" fill="var(--ink)">Ponto-espelho lateral</text>
  <text class="s-dimt" x="985.8" y="447.0" text-anchor="start">centro em y = 1,20 &#183; um de cada lado, mesma cota</text>
  <circle cx="964.8" cy="476.0" r="11.5" fill="var(--ray)"/>
  <text class="s-tag" x="964.8" y="480.0" text-anchor="middle" fill="var(--paper)">7</text>
  <text class="s-leg" x="985.8" y="474.0" text-anchor="start" fill="var(--ink)">Nuvem de teto</text>
  <text class="s-dimt" x="985.8" y="489.0" text-anchor="start">1,80 &#215; 0,60 &#183; centro em y = 1,25, se o ventilador deixar</text>
  <circle cx="964.8" cy="518.0" r="11.5" fill="var(--ray)"/>
  <text class="s-tag" x="964.8" y="522.0" text-anchor="middle" fill="var(--paper)">8</text>
  <text class="s-leg" x="985.8" y="516.0" text-anchor="start" fill="var(--ink)">Gobo m&#243;vel</text>
  <text class="s-dimt" x="985.8" y="531.0" text-anchor="start">1,20 &#215; 1,20 &#183; s&#243; na frente do vidro na hora de mixar</text>
  <line class="s-dim" x1="953.8" y1="574.0" x2="1303.8" y2="574.0"/>
  <text class="s-dimt" x="953.8" y="600.0" text-anchor="start" fill="var(--flag)" letter-spacing="1.5">AS COTAS QUE N&#195;O SE MEXEM</text>
  <text class="s-dimt" x="953.8" y="622.0" text-anchor="start">Dois cantos inteiros: frontal esquerdo e traseiro</text>
  <text class="s-dimt" x="953.8" y="639.0" text-anchor="start">direito. &#201; onde v&#227;o os dois traps de agora.</text>
  <text class="s-dimt" x="953.8" y="656.0" text-anchor="start"></text>
  <text class="s-dimt" x="953.8" y="673.0" text-anchor="start">Os outros dois est&#227;o ocupados s&#243; embaixo &#8212; a porta</text>
  <text class="s-dimt" x="953.8" y="690.0" text-anchor="start">at&#233; 2,10 e o arm&#225;rio at&#233; ~1,35. Sobram 0,55 e 1,30 m</text>
  <text class="s-dimt" x="953.8" y="707.0" text-anchor="start">de canto alto, guardados para os pr&#243;ximos traps.</text>
  <text class="s-dimt" x="953.8" y="724.0" text-anchor="start"></text>
  <text class="s-dimt" x="953.8" y="741.0" text-anchor="start">Para o modo, tanto faz qual canto: todos s&#227;o ventre</text>
  <text class="s-dimt" x="953.8" y="758.0" text-anchor="start">de press&#227;o. Na diagonal os dois ainda se atrapalham</text>
  <text class="s-dimt" x="953.8" y="775.0" text-anchor="start">menos, porque n&#227;o dividem a mesma regi&#227;o de campo.</text>
  <text class="s-dimt" x="953.8" y="792.0" text-anchor="start"></text>
  <text class="s-dimt" x="953.8" y="809.0" text-anchor="start">Baffle a 0,92 m: a 5 mm do n&#243; de 92,7 Hz.</text>
  <text class="s-dimt" x="953.8" y="826.0" text-anchor="start">Tweeter e orelha a 1,10 m. Separa&#231;&#227;o 0,77 m.</text>
