  <text class="s-dimt" x="1230.0" y="546.0" text-anchor="start">Encoste em at&#233; 0,20 m, ou afaste al&#233;m de 1,20 m.</text>
  <text class="s-dimt" x="1230.0" y="563.0" text-anchor="start">O meio-termo &#233; o pior lugar poss&#237;vel.</text>
  <text class="s-dimt" x="1230.0" y="580.0" text-anchor="start"></text>
  <text class="s-dimt" x="1230.0" y="597.0" text-anchor="start">As HS s&#227;o portadas atr&#225;s: 0,15 m &#233; o m&#237;nimo</text>
  <text class="s-dimt" x="1230.0" y="614.0" text-anchor="start">para o port respirar. N&#227;o encoste mais que isso.</text>
  <text class="s-dimt" x="1230.0" y="631.0" text-anchor="start"></text>
  <text class="s-dimt" x="1230.0" y="648.0" text-anchor="start">MOVER &#201; O REM&#201;DIO DE PRIMEIRA LINHA.</text>
  <text class="s-dimt" x="1230.0" y="665.0" text-anchor="start">Se n&#227;o der para mover, o segundo rem&#233;dio &#233; l&#227; grossa</text>
  <text class="s-dimt" x="1230.0" y="682.0" text-anchor="start">na parede frontal, atr&#225;s e ao lado do monitor L.</text>
  <text class="s-dimt" x="1230.0" y="699.0" text-anchor="start"></text>
  <text class="s-dimt" x="1230.0" y="716.0" text-anchor="start">O trap de canto atende o MODO da sala. Cancelamento</text>
  <text class="s-dimt" x="1230.0" y="733.0" text-anchor="start">de fronteira quer massa porosa no ponto onde a onda</text>
  <text class="s-dimt" x="1230.0" y="750.0" text-anchor="start">bate &#8212; s&#227;o dois problemas e dois rem&#233;dios.</text>
