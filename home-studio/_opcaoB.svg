  <text class="s-dimt" x="1188.2" y="269.0" text-anchor="middle">0,424</text>
  <rect x="1391.8" y="230.0" width="214.5" height="107.3" fill="none" stroke="var(--mute)" stroke-width="1.6" stroke-dasharray="6 4"/>
  <rect x="1391.8" y="230.0" width="76.4" height="76.4" fill="var(--mdf-soft)" stroke="var(--mdf)" stroke-width="1.6"/>
  <line x1="1391.8" y1="306.4" x2="1468.2" y2="230.0" stroke="var(--mdf)" stroke-width="2.4"/>
