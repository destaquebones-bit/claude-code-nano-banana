  <text class="s-lbl" x="988.6" y="184.3" text-anchor="start" fill="var(--felt)">Fechado dos seis lados</text>
  <text class="s-dimt" x="988.6" y="198.3" text-anchor="start">frente, os dois lados e as</text>
  <text class="s-dimt" x="988.6" y="212.3" text-anchor="start">duas tampas &#8212; tudo tecido</text>
  <text class="s-dimt" x="650.0" y="158.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">2 &#183; FECHADO &#183; nada aparece e nada cai</text>
  <text class="s-dimt" x="1150.0" y="172.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">3 &#183; OS 8 TRI&#194;NGULOS SAEM DE 2 RETALHOS</text>
  <text class="s-dimt" x="1150.0" y="190.0" text-anchor="start">Retalho de 1,20 &#215; 0,60 de compensado 6 mm. Dois quadrados, um corte na diagonal em cada.</text>
