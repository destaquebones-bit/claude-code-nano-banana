  <text class="s-dimt" x="456.0" y="676.2" text-anchor="start">+ 4  tr&#234;s travessas de 0,60</text>
  <text class="s-dimt" x="60.0" y="178.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">1 &#183; O ESQUELETO DE UM M&#211;DULO</text>
  <text class="s-dimt" x="60.0" y="196.0" text-anchor="start">&#201; a escada da Op&#231;&#227;o A mais tr&#234;s pe&#231;as: dois tri&#226;ngulos e a longarina do v&#233;rtice.</text>
