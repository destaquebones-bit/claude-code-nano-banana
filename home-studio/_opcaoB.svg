  <text class="s-dimt" x="60.0" y="54.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.6">OP&#199;&#195;O B &#183; PRISMA AUTOPORTANTE, FECHADO EM TECIDO</text>
  <text class="s-dimt" x="60.0" y="74.0" text-anchor="start">Sem furar parede. Cada m&#243;dulo &#233; uma caixa fechada de 0,424 &#215; 0,424 &#215; 1,20 &#8212; dois por trap.</text>
