  <line x1="1468.2" y1="306.4" x2="1544.7" y2="230.0" stroke="var(--mdf)" stroke-width="2.4"/>
  <text class="s-dimt" x="1499.0" y="350.9" text-anchor="middle">1,20 &#215; 0,60</text>
  <text class="s-dimt" x="1430.0" y="269.0" text-anchor="middle">0,424</text>
  <text class="s-dimt" x="1150.0" y="386.0" text-anchor="start">Sobra a faixa de 1,20 &#215; 0,17 em cada retalho &#8212; guarde para calços.</text>
  <text class="s-dimt" x="1150.0" y="524.0" text-anchor="start" fill="var(--flag)" letter-spacing="1.5">4 &#183; O PONTO FRACO: ELE TOMBA F&#193;CIL</text>
  <polygon points="1150.0,690.0 1300.0,690.0 1150.0,580.0" fill="var(--sunk)" stroke="var(--mute)" stroke-width="1.6"/>
  <line x1="1202.0" y1="690.0" x2="1202.0" y2="648.0" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="1202.0" cy="653.0" r="5" fill="var(--flag)"/>
  <text class="s-dimt" x="1212.0" y="658.0" text-anchor="start" fill="var(--flag)">centro de massa</text>
  <line x1="1150.0" y1="690.0" x2="1300.0" y2="690.0" stroke="var(--ink)" stroke-width="2.5"/>
  <text class="s-dimt" x="1300.0" y="708.0" text-anchor="end">aresta de tombo</text>
  <text class="s-dimt" x="1340.0" y="570.0" text-anchor="start">Com o prisma vazio, o centro de massa fica a</text>
  <text class="s-dimt" x="1340.0" y="586.0" text-anchor="start">apenas 10 cm atr&#225;s da aresta da frente. Um</text>
  <text class="s-dimt" x="1340.0" y="602.0" text-anchor="start">empurr&#227;o de 5&#176; j&#225; derruba.</text>
  <text class="s-dimt" x="1340.0" y="628.0" text-anchor="start" fill="var(--flag)">Solu&#231;&#227;o: 8 a 12 kg de areia ensacada dentro do</text>
  <text class="s-dimt" x="1340.0" y="644.0" text-anchor="start" fill="var(--flag)">m&#243;dulo de baixo. Vai para 10&#8211;12&#176;, custa R$ 10 e</text>
  <text class="s-dimt" x="1340.0" y="660.0" text-anchor="start" fill="var(--flag)">n&#227;o muda nada na ac&#250;stica.</text>
  <text class="s-dimt" x="1340.0" y="686.0" text-anchor="start">Se tiver crian&#231;a ou animal, some UM parafuso no</text>
  <text class="s-dimt" x="1340.0" y="702.0" text-anchor="start">topo &#8212; a&#237; volta a furar parede, mas s&#243; um furo.</text>
  <text class="s-dimt" x="1700.0" y="200.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">A CONTRA B</text>
  <line x1="1700.0" y1="210.0" x2="2030.0" y2="210.0" stroke="var(--mute)" stroke-width="1"/>
  <text class="s-dimt" x="1940.0" y="188.0" text-anchor="end" fill="var(--mute)">A</text>
  <text class="s-dimt" x="2030.0" y="188.0" text-anchor="end" fill="var(--flag)">B</text>
  <text class="s-dimt" x="1700.0" y="234.0" text-anchor="start">Ripa</text>
  <text class="s-dimt" x="1940.0" y="234.0" text-anchor="end">18,0 m</text>
  <text class="s-dimt" x="2030.0" y="234.0" text-anchor="end">21,6 m</text>
  <text class="s-dimt" x="1700.0" y="253.0" text-anchor="start">Chapa 6 mm</text>
  <text class="s-dimt" x="1940.0" y="253.0" text-anchor="end">&#8212;</text>
  <text class="s-dimt" x="2030.0" y="253.0" text-anchor="end" fill="var(--flag)">1,44 m&#178;</text>
  <text class="s-dimt" x="1700.0" y="272.0" text-anchor="start">Tecido ac&#250;stico</text>
  <text class="s-dimt" x="1940.0" y="272.0" text-anchor="end">3,5 m</text>
  <text class="s-dimt" x="2030.0" y="272.0" text-anchor="end">3,5 m</text>
  <text class="s-dimt" x="1700.0" y="291.0" text-anchor="start">Tecido barato (lados)</text>
  <text class="s-dimt" x="1940.0" y="291.0" text-anchor="end">&#8212;</text>
  <text class="s-dimt" x="2030.0" y="291.0" text-anchor="end" fill="var(--flag)">3,5 m</text>
  <text class="s-dimt" x="1700.0" y="310.0" text-anchor="start">Bucha e parafuso na parede</text>
  <text class="s-dimt" x="1940.0" y="310.0" text-anchor="end">16</text>
  <text class="s-dimt" x="2030.0" y="310.0" text-anchor="end" fill="var(--flag)">0</text>
  <text class="s-dimt" x="1700.0" y="329.0" text-anchor="start">Lastro de areia</text>
  <text class="s-dimt" x="1940.0" y="329.0" text-anchor="end">&#8212;</text>
  <text class="s-dimt" x="2030.0" y="329.0" text-anchor="end">10 kg</text>
  <line x1="1700.0" y1="352.0" x2="2030.0" y2="352.0" stroke="var(--rule)" stroke-width="1"/>
  <text class="s-dimt" x="1700.0" y="372.0" text-anchor="start">Custo a mais da B</text>
  <text class="s-dimt" x="1940.0" y="372.0" text-anchor="end"></text>
  <text class="s-dimt" x="2030.0" y="372.0" text-anchor="end" fill="var(--flag)">R$ 90 a 170</text>
  <text class="s-dimt" x="1700.0" y="399.0" text-anchor="start">Ordem de grandeza para conferir na sua regi&#227;o.</text>
  <text class="s-dimt" x="1700.0" y="415.0" text-anchor="start">O que pesa &#233; a chapa e os 3,6 m de ripa a mais.</text>
  <text class="s-dimt" x="1700.0" y="453.0" text-anchor="start" fill="var(--ray)" letter-spacing="1.5">O QUE A B COMPRA</text>
  <line x1="1700.0" y1="463.0" x2="2030.0" y2="463.0" stroke="var(--mute)" stroke-width="1"/>
  <text class="s-dimt" x="1700.0" y="487.0" text-anchor="start">Nenhum furo de parede.</text>
  <text class="s-dimt" x="1700.0" y="503.0" text-anchor="start"></text>
  <text class="s-dimt" x="1700.0" y="519.0" text-anchor="start">Move inteiro: levanta e leva, a manta vai junto</text>
  <text class="s-dimt" x="1700.0" y="535.0" text-anchor="start">dentro da caixa. Se a sala mudar, ou se voc&#234;</text>
  <text class="s-dimt" x="1700.0" y="551.0" text-anchor="start">mudar de casa, ele vai junto pronto.</text>
  <text class="s-dimt" x="1700.0" y="567.0" text-anchor="start"></text>
  <text class="s-dimt" x="1700.0" y="583.0" text-anchor="start">Mais r&#237;gido: os tri&#226;ngulos travam o esquadro</text>
  <text class="s-dimt" x="1700.0" y="599.0" text-anchor="start">para sempre, sem depender do canto.</text>
  <text class="s-dimt" x="1700.0" y="615.0" text-anchor="start"></text>
  <text class="s-dimt" x="1700.0" y="631.0" text-anchor="start">Serve em qualquer canto, inclusive nos dois que</text>
  <text class="s-dimt" x="1700.0" y="647.0" text-anchor="start">hoje est&#227;o bloqueados, se um dia liberarem.</text>
  <text class="s-dimt" x="1700.0" y="681.0" text-anchor="start" fill="var(--ray)" letter-spacing="1.5">O QUE N&#195;O MUDA</text>
  <line x1="1700.0" y1="691.0" x2="2030.0" y2="691.0" stroke="var(--mute)" stroke-width="1"/>
  <text class="s-dimt" x="1700.0" y="715.0" text-anchor="start">O corte da manta: 0,615 / 0,465 / 0,315 / 0,165.</text>
  <text class="s-dimt" x="1700.0" y="731.0" text-anchor="start">A ordem de entrada, da mais estreita para fora.</text>
  <text class="s-dimt" x="1700.0" y="747.0" text-anchor="start">O envelope do tecido na face da frente.</text>
  <text class="s-dimt" x="1700.0" y="763.0" text-anchor="start">As 4 escadas que voc&#234; j&#225; ia fazer &#8212; elas viram</text>
