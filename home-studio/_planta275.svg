  <circle cx="1024.5" cy="206.0" r="12" fill="var(--flag)"/>
  <text class="s-tag" x="1024.5" y="210.0" text-anchor="middle" fill="var(--paper)">A</text>
  <text class="s-leg" x="1048.5" y="204.0" text-anchor="start" fill="var(--ink)">Dobradi&#231;a na parede direita</text>
  <text class="s-dimt" x="1048.5" y="220.0" text-anchor="start">A folha abre encostando na lateral.</text>
  <text class="s-dimt" x="1048.5" y="236.0" text-anchor="start">Livra o monitor direito por 47 cm. &#201; a melhor.</text>
  <circle cx="1024.5" cy="274.0" r="12" fill="var(--mute)"/>
  <text class="s-tag" x="1024.5" y="278.0" text-anchor="middle" fill="var(--paper)">B</text>
  <text class="s-leg" x="1048.5" y="272.0" text-anchor="start" fill="var(--ink)">Dobradi&#231;a no batente esquerdo</text>
  <text class="s-dimt" x="1048.5" y="288.0" text-anchor="start">A folha varre para dentro da sala.</text>
  <text class="s-dimt" x="1048.5" y="304.0" text-anchor="start">Passa a 4,7 cm do monitor direito. Aperta.</text>
  <line class="s-dim" x1="1012.5" y1="352.0" x2="1372.5" y2="352.0"/>
  <text class="s-dimt" x="1012.5" y="380.0" text-anchor="start" fill="var(--flag)" letter-spacing="1.5">MAS A CONCLUS&#195;O &#201; A MESMA</text>
  <text class="s-dimt" x="1012.5" y="404.0" text-anchor="start">Nos dois casos o arco de 0,88 m varre o canto</text>
  <text class="s-dimt" x="1012.5" y="421.0" text-anchor="start">frontal direito inteiro at&#233; a altura da porta.</text>
  <text class="s-dimt" x="1012.5" y="438.0" text-anchor="start"></text>
  <text class="s-dimt" x="1012.5" y="455.0" text-anchor="start">O bass trap desse canto s&#243; existe ACIMA de 2,10 m</text>
  <text class="s-dimt" x="1012.5" y="472.0" text-anchor="start">&#8212; e ali ele ainda serve, porque a press&#227;o modal</text>
  <text class="s-dimt" x="1012.5" y="489.0" text-anchor="start">&#233; m&#225;xima justamente no encontro do canto</text>
  <text class="s-dimt" x="1012.5" y="506.0" text-anchor="start">com o teto, que &#233; onde mora o modo de 132 Hz.</text>
  <text class="s-dimt" x="1012.5" y="537.0" text-anchor="start" fill="var(--flag)">3 = o trecho de trap que se perde</text>
  <text class="s-dimt" x="1012.5" y="554.0" text-anchor="start">1 = trap esquerdo, inteiro &#183; 4 = bloco de 4 m&#243;dulos</text>
  <text class="s-dimt" x="1012.5" y="571.0" text-anchor="start">5 = TV &#183; verde tracejado = os dois raios de reflex&#227;o</text>
