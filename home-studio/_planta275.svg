  <text class="s-dimt" x="52.0" y="44.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.6">PLANTA DO TER&#199;O FRONTAL &#183; LARGURA 2,75 m &#183; O CONFLITO DA PORTA</text>
  <text class="s-dimt" x="1012.5" y="170.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">OS DOIS LADOS DE DOBRADI&#199;A</text>
