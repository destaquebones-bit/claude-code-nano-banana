  <text class="s-dimt" x="450.0" y="347.6" text-anchor="start" fill="var(--flag)">as duas diagonais</text>
  <text class="s-dimt" x="450.0" y="361.6" text-anchor="start" fill="var(--flag)">t&#234;m que dar 1,342 m</text>
  <text class="s-dimt" x="200.0" y="201.0" text-anchor="start">B1 rente ao topo</text>
  <text class="s-dimt" x="200.0" y="713.0" text-anchor="start">B3 rente ao p&#233;</text>
  <text class="s-dimt" x="200.0" y="727.0" text-anchor="start">B2 no meio, centro em 0,60</text>
  <text class="s-dimt" x="660.0" y="138.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">2 &#183; O ENCAIXE &#183; corte pelo montante</text>
  <text class="s-dimt" x="660.0" y="158.0" text-anchor="start">Travessa por cima, dois parafusos em diagonal. Sem corte de esquadria.</text>
  <rect x="700.0" y="320.0" width="224.0" height="70.0" fill="url(#gr)" stroke="var(--wood)" stroke-width="2.2"/>
  <rect x="728.0" y="250.0" width="168.0" height="70.0" fill="var(--wood)" stroke="var(--ink)" stroke-width="2.2" fill-opacity=".9"/>
  <circle cx="763.0" cy="285.0" r="6.5" fill="none" stroke="var(--flag)" stroke-width="1.8"/>
