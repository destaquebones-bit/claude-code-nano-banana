  <text class="s-dimt" x="884.8" y="757.6" text-anchor="start" fill="var(--flag)">tala C dos dois lados</text>
  <text class="s-dimt" x="1180.0" y="150.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">AS PE&#199;AS</text>
  <line x1="1180.0" y1="160.0" x2="1510.0" y2="160.0" stroke="var(--mute)" stroke-width="1"/>
  <circle cx="1191.0" cy="182.0" r="11.0" fill="var(--wood)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="1191.0" y="186.0" text-anchor="middle" fill="var(--paper)">A</text>
  <text class="s-dimt" x="1210.0" y="186.0" text-anchor="start">Montante &#183; 1,20 m</text>
  <text class="s-dimt" x="1510.0" y="186.0" text-anchor="end">8 pe&#231;as</text>
  <circle cx="1191.0" cy="203.0" r="11.0" fill="var(--ink)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="1191.0" y="207.0" text-anchor="middle" fill="var(--paper)">B</text>
  <text class="s-dimt" x="1210.0" y="207.0" text-anchor="start">Travessa &#183; 0,60 m</text>
  <text class="s-dimt" x="1510.0" y="207.0" text-anchor="end">12 pe&#231;as</text>
  <circle cx="1191.0" cy="224.0" r="11.0" fill="var(--flag)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="1191.0" y="228.0" text-anchor="middle" fill="var(--paper)">C</text>
  <text class="s-dimt" x="1210.0" y="228.0" text-anchor="start">Tala de emenda &#183; 0,30 m</text>
  <text class="s-dimt" x="1510.0" y="228.0" text-anchor="end">4 pe&#231;as</text>
  <line x1="1180.0" y1="253.0" x2="1510.0" y2="253.0" stroke="var(--rule)" stroke-width="1"/>
  <text class="s-dimt" x="1180.0" y="273.0" text-anchor="start">Ripa total</text>
  <text class="s-dimt" x="1510.0" y="273.0" text-anchor="end" fill="var(--ray)">18,00 m</text>
  <text class="s-dimt" x="1180.0" y="294.0" text-anchor="start">Comprar / separar</text>
  <text class="s-dimt" x="1510.0" y="294.0" text-anchor="end" fill="var(--ray)">6 barras de 3 m</text>
  <text class="s-dimt" x="1180.0" y="321.0" text-anchor="start">S&#243; existem dois comprimentos de corte: 1,20 e 0,60.</text>
  <text class="s-dimt" x="1180.0" y="337.0" text-anchor="start">A medida da ripa n&#227;o muda nada &#8212; como a travessa</text>
  <text class="s-dimt" x="1180.0" y="353.0" text-anchor="start">vai POR CIMA, a largura da ripa n&#227;o entra na conta.</text>
  <text class="s-dimt" x="1180.0" y="391.0" text-anchor="start" fill="var(--flag)" letter-spacing="1.5">O QUE USAR</text>
  <line x1="1180.0" y1="401.0" x2="1510.0" y2="401.0" stroke="var(--mute)" stroke-width="1"/>
  <text class="s-dimt" x="1180.0" y="427.0" text-anchor="start">Parafuso &#183; bitola</text>
  <text class="s-dimt" x="1510.0" y="427.0" text-anchor="end">3,5 mm</text>
  <text class="s-dimt" x="1180.0" y="448.0" text-anchor="start">Parafuso &#183; comprimento</text>
  <text class="s-dimt" x="1510.0" y="448.0" text-anchor="end">travessa + 20 mm</text>
  <text class="s-dimt" x="1180.0" y="469.0" text-anchor="start">Quantidade</text>
  <text class="s-dimt" x="1510.0" y="469.0" text-anchor="end">60</text>
  <text class="s-dimt" x="1180.0" y="490.0" text-anchor="start">Brocas</text>
  <text class="s-dimt" x="1510.0" y="490.0" text-anchor="end">4 mm e 2,5 mm</text>
  <text class="s-dimt" x="1180.0" y="511.0" text-anchor="start">Serrote</text>
  <text class="s-dimt" x="1510.0" y="511.0" text-anchor="end">o de 550 mm que voc&#234; comprou</text>
  <text class="s-dimt" x="1180.0" y="532.0" text-anchor="start">Esquadro ou gabarito</text>
  <text class="s-dimt" x="1510.0" y="532.0" text-anchor="end">obrigat&#243;rio</text>
  <text class="s-dimt" x="1180.0" y="561.0" text-anchor="start">Antes de cortar: tire TODO prego, parafuso e</text>
  <text class="s-dimt" x="1180.0" y="577.0" text-anchor="start">cantoneira das ripas. Um s&#243; escondido acaba com</text>
  <text class="s-dimt" x="1180.0" y="593.0" text-anchor="start">os dentes do serrote em uma passada.</text>
  <text class="s-dimt" x="1180.0" y="631.0" text-anchor="start" fill="var(--ray)" letter-spacing="1.5">A ORDEM</text>
  <line x1="1180.0" y1="641.0" x2="1510.0" y2="641.0" stroke="var(--mute)" stroke-width="1"/>
  <circle cx="1191.0" cy="663.0" r="10.5" fill="var(--ray)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="1191.0" y="667.0" text-anchor="middle" fill="var(--paper)">1</text>
  <text class="s-dimt" x="1210.0" y="667.0" text-anchor="start">Limpar as ripas e escolher as retas para os A</text>
  <circle cx="1191.0" cy="686.0" r="10.5" fill="var(--ray)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="1191.0" y="690.0" text-anchor="middle" fill="var(--paper)">2</text>
  <text class="s-dimt" x="1210.0" y="690.0" text-anchor="start">Marcar todos os cortes antes de serrar</text>
  <circle cx="1191.0" cy="709.0" r="10.5" fill="var(--ray)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="1191.0" y="713.0" text-anchor="middle" fill="var(--paper)">3</text>
  <text class="s-dimt" x="1210.0" y="713.0" text-anchor="start">Cortar 8 &#215; 1,20 e 12 &#215; 0,60</text>
  <circle cx="1191.0" cy="732.0" r="10.5" fill="var(--ray)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="1191.0" y="736.0" text-anchor="middle" fill="var(--paper)">4</text>
