  <line x1="828.7" y1="289.3" x2="837.3" y2="280.7" stroke="var(--flag)" stroke-width="1.6"/>
  <line x1="833.0" y1="285.0" x2="833.0" y2="376.0" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text class="s-lbl" x="889.0" y="289.0" text-anchor="start" fill="var(--ink)">travessa B</text>
  <text class="s-lbl" x="945.0" y="359.0" text-anchor="start" fill="var(--wood)">montante A</text>
  <line x1="938.0" y1="355.0" x2="935.2" y2="355.0" stroke="var(--wood)" stroke-width="1"/>
  <text class="s-dimt" x="700.0" y="400.5" text-anchor="start">DOIS di&#226;metros de broca, e a ordem importa:</text>
  <text class="s-dimt" x="700.0" y="416.5" text-anchor="start"></text>
  <text class="s-dimt" x="700.0" y="432.5" text-anchor="start">&#183; na TRAVESSA, furo passante de 4 mm</text>
  <text class="s-dimt" x="700.0" y="448.5" text-anchor="start">  (o parafuso tem que passar solto)</text>
  <text class="s-dimt" x="700.0" y="464.5" text-anchor="start"></text>
  <text class="s-dimt" x="700.0" y="480.5" text-anchor="start">&#183; no MONTANTE, furo-guia de 2,5 mm</text>
  <text class="s-dimt" x="700.0" y="496.5" text-anchor="start">  entrando uns 15 mm</text>
  <text class="s-dimt" x="700.0" y="512.5" text-anchor="start"></text>
  <text class="s-dimt" x="700.0" y="528.5" text-anchor="start">&#201; isso que puxa as duas pe&#231;as uma contra a</text>
  <text class="s-dimt" x="700.0" y="544.5" text-anchor="start">outra. Furo fino nas duas deixa a junta aberta.</text>
  <text class="s-dimt" x="700.0" y="560.5" text-anchor="start"></text>
  <text class="s-dimt" x="700.0" y="576.5" text-anchor="start">DOIS parafusos por junta, na diagonal.</text>
  <text class="s-dimt" x="700.0" y="592.5" text-anchor="start">Um s&#243; deixa a travessa girar.</text>
  <circle cx="812.0" cy="285.0" r="11.0" fill="var(--ink)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="812.0" y="289.0" text-anchor="middle" fill="var(--paper)">B</text>
  <circle cx="903.0" cy="355.0" r="11.0" fill="var(--wood)" stroke="var(--paper)" stroke-width="2.2"/>
  <text class="s-tag" x="903.0" y="359.0" text-anchor="middle" fill="var(--paper)">A</text>
  <text class="s-dimt" x="660.0" y="552.0" text-anchor="start" fill="var(--ink)" letter-spacing="1.5">3 &#183; DUAS ESCADAS POR TRAP</text>
  <text class="s-dimt" x="660.0" y="572.0" text-anchor="start">Empilhadas d&#227;o 2,40 m. A tala C emenda as duas na hora de instalar.</text>
